name: Publish Adventure Capital Website
on:
  push:
    branches: [main]
    paths:
      - 'self-service/**'
      - 'river/**'
      - 'waiver/**'
      - 'rental/**'
      - 'index.html'
      - '.github/workflows/flovibez-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
